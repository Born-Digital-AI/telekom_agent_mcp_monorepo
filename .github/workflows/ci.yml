name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtualenv and install dev deps
        run: |
          uv venv
          uv pip install -r requirements-dev.in

      - name: Install all service requirements
        run: |
          shopt -s nullglob
          for req in svc/*/requirements.in; do
            uv pip install -r "$req"
          done

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: basedpyright
        run: uv run basedpyright

      - name: Import direction check
        run: uv run python bin/check_imports.py

      - name: Pytest (unit only)
        run: uv run pytest -m unit
