apiVersion: v1
kind: Service
metadata:
  name: mcp-template
  labels:
    app: mcp-template
    team: platform
  namespace: development
spec:
  selector:
    app: mcp-template
  ports:
    - name: mcp
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: healthz
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
