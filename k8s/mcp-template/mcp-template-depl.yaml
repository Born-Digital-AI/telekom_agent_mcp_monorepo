apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-template
  labels:
    app: mcp-template
    team: platform
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-template
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/healthz/metrics"
      labels:
        app: mcp-template
        team: platform
    spec:
      containers:
        - name: mcp-template
          image: borndigitalaibot/mcp-template:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
            - containerPort: 8080
          env:
            - name: APP_COLORIZE_LOGS
              value: 'False'
            - name: APP_JSON_FORMAT_LOGS
              value: 'True'
            - name: APP_GIT_COMMIT
              value: local

            # Healthz / Prometheus
            - name: APP_HEALTHZ_PROTOCOL
              value: http://
            - name: APP_HEALTHZ_LISTEN_HOST
              value: 0.0.0.0
            - name: APP_HEALTHZ_HOST
              value: mcp-template
            - name: APP_HEALTHZ_PORT
              value: '8080'
            - name: APP_COLLECT_METRICS
              value: 'True'

            # MCP transport
            - name: APP_MCP_NAME
              value: mcp-template
            - name: APP_MCP_TRANSPORT
              value: streamable-http
            - name: APP_MCP_HOST
              value: 0.0.0.0
            - name: APP_MCP_PORT
              value: '8000'
            - name: APP_MCP_STATELESS_HTTP
              value: 'True'

            # Auth (off for the demo template; flip to True + wire up secret if needed)
            - name: APP_MCP_AUTH_ENABLED
              value: 'False'
            # - name: APP_MCP_AUTH_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: mcp-server-secret
            #       key: mcp-auth-api-key

            # Logstash → Kibana
            - name: APP_LOGSTASH_ENABLED
              value: 'True'
            - name: APP_LOGSTASH_HOST
              value: '10.4.0.6'
            - name: APP_LOGSTASH_PORT
              value: '5959'
            - name: APP_LOGSTASH_DATABASE_PATH
              value: ''
          livenessProbe:
            httpGet:
              path: /healthz/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      imagePullSecrets:
        - name: regcred
