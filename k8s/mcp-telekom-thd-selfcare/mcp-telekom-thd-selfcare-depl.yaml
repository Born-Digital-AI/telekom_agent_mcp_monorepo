apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/healthz/metrics"
  labels:
    app: mcp-telekom-thd-selfcare
    team: mcp-servers
  name: mcp-telekom-thd-selfcare
  namespace: internal-test
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mcp-telekom-thd-selfcare
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: mcp-telekom-thd-selfcare
        team: mcp-servers
    spec:
      containers:
        - env:
            - name: APP_COLORIZE_LOGS
              value: 'False'
            - name: APP_JSON_FORMAT_LOGS
              value: 'True'
            - name: APP_GIT_COMMIT
              value: local
            
            # Healthz / Prometheus
            - name: APP_HEALTHZ_PROTOCOL
              value: http://
            - name: APP_HEALTHZ_LISTEN_HOST
              value: 0.0.0.0
            - name: APP_HEALTHZ_HOST
              value: mcp-telekom-thd-selfcare
            - name: APP_HEALTHZ_PORT
              value: '8080'
            - name: APP_COLLECT_METRICS
              value: 'True'

            # MCP transport
            - name: APP_MCP_NAME
              value: mcp-telekom-thd-selfcare
            - name: APP_MCP_TRANSPORT
              value: streamable-http
            - name: APP_MCP_HOST
              value: 0.0.0.0
            - name: APP_MCP_PORT
              value: '8000'
            - name: APP_MCP_STATELESS_HTTP
              value: 'True'

            # Logstash → Kibana
            - name: APP_LOGSTASH_ENABLED
              value: 'True'
            - name: APP_LOGSTASH_HOST
              value: '10.4.0.6'
            - name: APP_LOGSTASH_PORT
              value: '5959'
            - name: APP_LOGSTASH_DATABASE_PATH
              value: ''
            
            - name: APP_INDEXER_URL
              value: "http://indexer:8000/"
            - name: APP_INDEXER_INDEX_ID
              value: "442"
            - name: APP_INDEXER_ORGANIZATION_ID
              value: "697a36e43510b0d850bd19cc"
            - name: APP_INDEXER_PROJECT_ID
              value: "697a36f33510b0d850bd1a39"
            - name: APP_INDEXER_TIMEOUT_SECONDS
              value: "30"
            - name: APP_INDEXER_LABELS_CACHE_TTL_SECONDS
              value: "300"

            # Auth — enable in any environment that has untrusted callers.
            - name: APP_MCP_AUTH_ENABLED
              value: 'False'
            # Required even when auth is disabled: container runs with
            # --ignore-defaults, which forces every non-Optional config field to
            # be set via env. Unused at runtime when APP_MCP_AUTH_ENABLED=False.
            - name: APP_MCP_AUTH_ISSUER_URL
              value: 'http://localhost'

          image: borndigitalaibot/mcp-telekom-thd-selfcare:latest
          imagePullPolicy: IfNotPresent
          name: mcp-telekom-thd-selfcare
          ports:
            - containerPort: 8000
            - containerPort: 8080
          resources:
            limits:
              cpu: 200m
              memory: 300Mi
            requests:
              cpu: 50m
              memory: 150Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: regcred
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
